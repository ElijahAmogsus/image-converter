<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔄 Image Converter | ElijahAmogsus</title>
  <style>
    :root {
      --base: #1e1e2e; --mantle: #181825; --surface0: #313244;
      --surface1: #45475a; --text: #cdd6f4; --subtext0: #a6adc8;
      --accent: #89b4fa;
    }

    * { box-sizing: border-box; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }

    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      background-color: var(--base); color: var(--text); font-family: monospace;
    }

    body { display: flex; flex-direction: column; align-items: center; padding: 30px 16px; }

    .back-link { color: var(--accent); text-decoration: none; font-weight: bold; margin-top: 24px; display: inline-block; }
    .back-link:hover { text-decoration: underline; }

    .theme-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; align-items: center; }

    .theme-btn, .accent-select {
      background-color: var(--mantle); color: var(--text); border: 2px solid var(--surface1);
      border-radius: 6px; padding: 6px 12px; font-family: monospace; font-weight: bold; cursor: pointer;
    }

    .theme-btn:hover, .theme-btn.active, .accent-select:hover, .accent-select:focus {
      border-color: var(--accent); background-color: var(--surface0); outline: none;
    }

    h1 { color: var(--accent); margin: 0 0 8px 0; font-size: clamp(1.5rem, 6vw, 2rem); text-align: center; }
    p { color: var(--subtext0); margin: 0 0 24px 0; text-align: center; }

    .box { width: 100%; max-width: 720px; background-color: var(--mantle); border: 2px solid var(--surface1); border-radius: 10px; padding: 20px; }

    .drop-zone { border: 2px dashed var(--surface1); border-radius: 8px; padding: 32px 16px; text-align: center; cursor: pointer; background-color: var(--base); }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); background-color: var(--surface0); }

    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { color: var(--subtext0); font-size: 0.9rem; font-weight: bold; }

    select:not(.accent-select), input[type="range"] { width: 100%; background-color: var(--base); color: var(--text); border: 2px solid var(--surface1); border-radius: 6px; padding: 8px; font-family: monospace; }
    input[type="range"] { padding: 0; accent-color: var(--accent); cursor: pointer; }

    .row { display: flex; align-items: center; gap: 8px; }
    input[type="color"] { width: 40px; height: 34px; border: none; background: transparent; cursor: pointer; }

    .preview-grid { display: none; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .preview-grid.active { display: grid; }

    .card { background-color: var(--base); border: 2px solid var(--surface1); border-radius: 8px; padding: 12px; text-align: center; }
    .card h3 { color: var(--accent); margin: 0 0 8px 0; font-size: 1rem; }
    .card img { max-width: 100%; max-height: 200px; border-radius: 6px; }
    .card img:not([src]), .card img[src=""] { display: none; }
    .meta { color: var(--subtext0); font-size: 0.85rem; margin-top: 8px; word-break: break-word; }

    .actions { display: none; gap: 10px; margin-top: 18px; }
    .actions.active { display: flex; }

    .btn { flex: 1; padding: 10px 14px; border: 2px solid var(--accent); border-radius: 6px; background-color: var(--accent); color: var(--base); font-family: monospace; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.secondary { background-color: var(--base); color: var(--text); border-color: var(--surface1); }
    .btn.secondary:hover { border-color: var(--accent); }

    @media (max-width: 600px) { .preview-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('mocha')">🌿 Mocha</button>
    <button class="theme-btn" onclick="setTheme('macchiato')">🌺 Macchiato</button>
    <button class="theme-btn" onclick="setTheme('frappe')">🪴 Frappé</button>
    <button class="theme-btn" onclick="setTheme('latte')">🌻 Latte</button>
    <select id="accentSelect" class="accent-select" onchange="setAccent(this.value)" aria-label="Accent Color">
      <option value="rosewater">🌸 Rosewater</option>
      <option value="flamingo">🦩 Flamingo</option>
      <option value="pink">💖 Pink</option>
      <option value="mauve">🔮 Mauve</option>
      <option value="red">🍎 Red</option>
      <option value="maroon">🍒 Maroon</option>
      <option value="peach">🍑 Peach</option>
      <option value="yellow">🍋 Yellow</option>
      <option value="green">🍏 Green</option>
      <option value="teal">🌊 Teal</option>
      <option value="sky">☁️ Sky</option>
      <option value="sapphire">💎 Sapphire</option>
      <option value="blue" selected>💙 Blue</option>
      <option value="lavender">🪻 Lavender</option>
    </select>
  </div>

  <h1>🔄 Image Converter</h1>
  <p>Convert images between PNG, JPG, WEBP, AVIF, JXL, BMP, and ICO</p>

  <div class="box">
    <div class="drop-zone" id="dropZone">
      <strong>Drop any image here or click to browse</strong>
      <div style="color: var(--subtext0); font-size: 0.85rem; margin-top: 6px;">PNG, JPG, WEBP, AVIF, JXL, GIF, SVG, BMP, ICO</div>
      <input type="file" id="fileInput" accept="image/*,.avif,.jxl" hidden>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="formatSelect">Target Format</label>
        <select id="formatSelect">
          <option value="image/png" data-ext="png">PNG (Lossless)</option>
          <option value="image/jpeg" data-ext="jpg">JPG / JPEG</option>
          <option value="image/webp" data-ext="webp" selected>WEBP</option>
          <option value="image/avif" data-ext="avif">AVIF (Next-Gen)</option>
          <option value="image/jxl" data-ext="jxl">JXL (JPEG XL)</option>
          <option value="image/bmp" data-ext="bmp">BMP (24-bit)</option>
          <option value="image/x-icon" data-ext="ico">ICO (64×64 Favicon)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="qualitySlider">Quality: <span id="qualityVal">90%</span></label>
        <input type="range" id="qualitySlider" min="10" max="100" value="90">
      </div>

      <div class="control-group">
        <label for="bgColor">Alpha Fill (JPG/BMP)</label>
        <div class="row">
          <input type="color" id="bgColor" value="#1e1e2e">
          <span style="color: var(--subtext0); font-size: 0.85rem;">Transparent bg</span>
        </div>
      </div>
    </div>

    <div class="preview-grid" id="previewGrid">
      <div class="card">
        <h3>Original</h3>
        <img id="origPreview" alt="Original">
        <div class="meta" id="origMeta"></div>
      </div>
      <div class="card">
        <h3>Converted</h3>
        <img id="convPreview" alt="Converted">
        <div class="meta" id="convMeta"></div>
      </div>
    </div>

    <div class="actions" id="actions">
      <button class="btn" id="downloadBtn">Download Converted File</button>
      <button class="btn secondary" id="clearBtn">Clear</button>
    </div>
  </div>

  <a href="/" class="back-link">← Back to Dev Hub</a>
    <script type="module">
    const themes = {
      mocha: {
        base: '#1e1e2e', mantle: '#181825', surface0: '#313244', surface1: '#45475a', text: '#cdd6f4', subtext0: '#a6adc8',
        accents: { rosewater: '#f5e0dc', flamingo: '#f2cdcd', pink: '#f5c2e7', mauve: '#cba6f7', red: '#f38ba8', maroon: '#eba0ac', peach: '#fab387', yellow: '#f9e2af', green: '#a6e3a1', teal: '#94e2d5', sky: '#89dceb', sapphire: '#74c7ec', blue: '#89b4fa', lavender: '#b4befe' }
      },
      macchiato: {
        base: '#24273a', mantle: '#1e2030', surface0: '#363a4f', surface1: '#494d64', text: '#cad3f5', subtext0: '#a5adcb',
        accents: { rosewater: '#f4dbd6', flamingo: '#f0c6c6', pink: '#f5bde6', mauve: '#c6a0f6', red: '#ed8796', maroon: '#ee99a0', peach: '#f5a97f', yellow: '#eed49f', green: '#a6da95', teal: '#8bd5ca', sky: '#91d7e3', sapphire: '#7dc4e4', blue: '#8aadf4', lavender: '#b7bdf8' }
      },
      frappe: {
        base: '#303446', mantle: '#292c3c', surface0: '#414559', surface1: '#51576d', text: '#c6d0f5', subtext0: '#a5adce',
        accents: { rosewater: '#f2d5cf', flamingo: '#eebebe', pink: '#f4b8e4', mauve: '#ca9ee6', red: '#e78284', maroon: '#ea999c', peach: '#ef9f76', yellow: '#e5c890', green: '#a6d189', teal: '#81c8be', sky: '#99d1db', sapphire: '#85c1dc', blue: '#8caaee', lavender: '#babbf1' }
      },
      latte: {
        base: '#eff1f5', mantle: '#e6e9ef', surface0: '#ccd0da', surface1: '#bcc0cc', text: '#4c4f69', subtext0: '#6c6f85',
        accents: { rosewater: '#dc8a78', flamingo: '#dd7878', pink: '#ea76cb', mauve: '#8839ef', red: '#d20f39', maroon: '#e64553', peach: '#fe640b', yellow: '#df8e1d', green: '#40a02b', teal: '#179299', sky: '#04a5e5', sapphire: '#209fb5', blue: '#1e66f5', lavender: '#7287fd' }
      }
    };

    let currentTheme = localStorage.getItem('catppuccin-theme') || 'mocha';
    let currentAccent = localStorage.getItem('catppuccin-accent') || 'blue';

    function applyPalette() {
      const p = themes[currentTheme] || themes.mocha;
      const root = document.documentElement.style;
      for (const [k, v] of Object.entries(p)) {
        if (k !== 'accents') root.setProperty('--' + k, v);
      }
      root.setProperty('--accent', p.accents[currentAccent] || p.accents.blue);

      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes("'" + currentTheme + "'"));
      });
      document.getElementById('accentSelect').value = currentAccent;
    }

    window.setTheme = function(name) { currentTheme = name; localStorage.setItem('catppuccin-theme', name); applyPalette(); };
    window.setAccent = function(accent) { currentAccent = accent; localStorage.setItem('catppuccin-accent', accent); applyPalette(); };
    applyPalette();

    function formatBytes(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(2) + ' MB';
    }

    function encodeBMP(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const imgData = ctx.getImageData(0, 0, w, h).data;
      const rowSize = Math.floor((24 * w + 31) / 32) * 4;
      const pixelArraySize = rowSize * h;
      const fileSize = 54 + pixelArraySize;
      const buffer = new ArrayBuffer(fileSize);
      const view = new DataView(buffer);

      view.setUint16(0, 0x424d, false);
      view.setUint32(2, fileSize, true);
      view.setUint32(10, 54, true);
      view.setUint32(14, 40, true);
      view.setInt32(18, w, true);
      view.setInt32(22, h, true);
      view.setUint16(26, 1, true);
      view.setUint16(28, 24, true);
      view.setUint32(34, pixelArraySize, true);

      let offset = 54;
      for (let y = h - 1; y >= 0; y--) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          view.setUint8(offset++, imgData[i + 2]);
          view.setUint8(offset++, imgData[i + 1]);
          view.setUint8(offset++, imgData[i]);
        }
        while ((offset - 54) % rowSize !== 0) view.setUint8(offset++, 0);
      }
      return new Blob([buffer], { type: 'image/bmp' });
    }

    async function encodeICO(sourceImg) {
      const size = 64;
      const icoCanvas = document.createElement('canvas');
      icoCanvas.width = size;
      icoCanvas.height = size;
      icoCanvas.getContext('2d').drawImage(sourceImg, 0, 0, size, size);

      const pngBlob = await new Promise(res => icoCanvas.toBlob(res, 'image/png'));
      const pngBytes = new Uint8Array(await pngBlob.arrayBuffer());
      const icoBuffer = new ArrayBuffer(22 + pngBytes.length);
      const view = new DataView(icoBuffer);

      view.setUint16(0, 0, true);
      view.setUint16(2, 1, true);
      view.setUint16(4, 1, true);
      view.setUint8(6, size);
      view.setUint8(7, size);
      view.setUint8(8, 0);
      view.setUint8(9, 0);
      view.setUint16(10, 1, true);
      view.setUint16(12, 32, true);
      view.setUint32(14, pngBytes.length, true);
      view.setUint32(18, 22, true);

      new Uint8Array(icoBuffer, 22).set(pngBytes);
      return new Blob([icoBuffer], { type: 'image/x-icon' });
    }
          const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const formatSelect = document.getElementById('formatSelect');
    const qualitySlider = document.getElementById('qualitySlider');
    const qualityVal = document.getElementById('qualityVal');
    const bgColor = document.getElementById('bgColor');
    const previewGrid = document.getElementById('previewGrid');
    const origPreview = document.getElementById('origPreview');
    const convPreview = document.getElementById('convPreview');
    const origMeta = document.getElementById('origMeta');
    const convMeta = document.getElementById('convMeta');
    const actions = document.getElementById('actions');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');

    const CODEC_URLS = {
      avif: 'https://esm.sh',
      jxl: 'https://esm.sh'
    };

    let loadedImage = null;
    let originalName = 'converted';
    let convertedBlobUrl = null;

    async function tryNativeAvif(canvas, quality) {
      const blob = await new Promise(res => canvas.toBlob(res, 'image/avif', quality));
      if (blob && blob.type === 'image/avif') return blob;
      return null;
    }

    async function convertImage() {
      if (!loadedImage) return;
      const selectedOption = formatSelect.options.item(formatSelect.selectedIndex);
      const mime = formatSelect.value;
      const ext = selectedOption.getAttribute('data-ext');
      const qualityNum = parseInt(qualitySlider.value, 10);
      const quality = qualityNum / 100;

      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Converting...';
      convPreview.removeAttribute('src');

      try {
        const canvas = document.createElement('canvas');
        canvas.width = loadedImage.naturalWidth;
        canvas.height = loadedImage.naturalHeight;
        const ctx = canvas.getContext('2d');

        if (mime === 'image/jpeg' || mime === 'image/bmp') {
          ctx.fillStyle = bgColor.value;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(loadedImage, 0, 0);

        let blob = null;
        let previewSrc = null;

        if (mime === 'image/avif') {
          blob = await tryNativeAvif(canvas, quality);
        }

        if (!blob && (mime === 'image/avif' || mime === 'image/jxl')) {
          convMeta.textContent = 'Loading ' + ext.toUpperCase() + ' Wasm encoder...';
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const codec = await import(CODEC_URLS[ext]);
          convMeta.textContent = 'Encoding ' + ext.toUpperCase() + '...';
          const outBuffer = await codec.encode(imgData, { quality: qualityNum });
          blob = new Blob([outBuffer], { type: mime });
          previewSrc = canvas.toDataURL('image/png');
        } else if (mime === 'image/bmp') {
          blob = encodeBMP(canvas);
        } else if (mime === 'image/x-icon') {
          blob = await encodeICO(loadedImage);
        } else if (!blob) {
          blob = await new Promise(res => canvas.toBlob(res, mime, quality));
        }

        if (convertedBlobUrl) URL.revokeObjectURL(convertedBlobUrl);
        convertedBlobUrl = URL.createObjectURL(blob);

        convPreview.src = previewSrc || convertedBlobUrl;
        const dims = mime === 'image/x-icon' ? '64×64' : canvas.width + '×' + canvas.height;
        convMeta.textContent = ext.toUpperCase() + ' • ' + dims + ' • ' + formatBytes(blob.size);

        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Download Converted File';
        downloadBtn.onclick = () => {
          const a = document.createElement('a');
          a.href = convertedBlobUrl;
          a.download = originalName + '.' + ext;
          a.click();
        };
      } catch (err) {
        console.error(err);
        convMeta.textContent = 'Error: ' + err.message;
        downloadBtn.textContent = 'Conversion Failed';
      }
    }

    async function handleFile(file) {
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      const isNextGen = ext === 'avif' || ext === 'jxl';
      if (!file.type.startsWith('image/') && !isNextGen) return;

      originalName = file.name.replace(/\.[^/.]+$/, '');
      previewGrid.classList.add('active');
      actions.classList.add('active');

      if (isNextGen) {
        try {
          origMeta.textContent = 'Decoding ' + ext.toUpperCase() + '...';
          const buffer = await file.arrayBuffer();
          const codec = await import(CODEC_URLS[ext]);
          const imageData = await codec.decode(buffer);

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = imageData.width;
          tempCanvas.height = imageData.height;
          tempCanvas.getContext('2d').putImageData(imageData, 0, 0);

          const dataUrl = tempCanvas.toDataURL('image/png');
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            origPreview.src = dataUrl;
            origMeta.textContent = ext.toUpperCase() + ' • ' + img.naturalWidth + '×' + img.naturalHeight + ' • ' + formatBytes(file.size);
            convertImage();
          };
          img.src = dataUrl;
        } catch (err) {
          console.error(err);
          origMeta.textContent = 'Decode Error: ' + err.message;
        }
      } else {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            loadedImage = img;
            origPreview.src = e.target.result;
            const label = (file.type.replace('image/', '') || ext).toUpperCase();
            origMeta.textContent = label + ' • ' + img.naturalWidth + '×' + img.naturalHeight + ' • ' + formatBytes(file.size);
            convertImage();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => {
      const file = e.target.files ? e.target.files.item(0) : null;
      if (file) handleFile(file);
    });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files ? e.dataTransfer.files.item(0) : null;
      if (file) handleFile(file);
    });
    formatSelect.addEventListener('change', convertImage);
    bgColor.addEventListener('input', convertImage);
    qualitySlider.addEventListener('input', () => { qualityVal.textContent = qualitySlider.value + '%'; convertImage(); });
    clearBtn.addEventListener('click', () => {
      loadedImage = null;
      fileInput.value = '';
      origPreview.removeAttribute('src');
      convPreview.removeAttribute('src');
      previewGrid.classList.remove('active');
      actions.classList.remove('active');
    });
  </script>
</body>
</html>
